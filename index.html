<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#060d18" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GOLF LOG" />

  <!-- PWA manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Apple Touch Icon (iOS ホーム画面アイコン) -->
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

  <title>GOLF LOG</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body, #root {
      height: 100%;
      background: #060d18;
      font-family: -apple-system, 'Noto Sans JP', sans-serif;
      color: #e2e8f0;
      /* iOS safe area */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* スクロールバー非表示 */
    ::-webkit-scrollbar { display: none; }
    /* ローディング画面 */
    #loading {
      position: fixed; inset: 0;
      background: #060d18;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; z-index: 9999;
      transition: opacity 0.4s;
    }
    #loading .logo {
      font-size: 28px; font-weight: 900;
      background: linear-gradient(90deg, #34d399, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #loading .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(52,211,153,0.2);
      border-top-color: #34d399;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">⛳ GOLF LOG</div>
    <div class="spinner"></div>
  </div>
  <div id="root"></div>

  <!-- React + ReactDOM (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- ビルド済みアプリ本体（JSXトランスパイル済み・Babel不要） -->
  <script src="app.js"></script>

  <script>
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(GolfTracker));

    const hideLoading = () => {
      const el = document.getElementById('loading');
      if (el) { el.classList.add('hidden'); setTimeout(() => el.remove(), 400); }
    };
    if (document.readyState === 'complete') {
      setTimeout(hideLoading, 100);
    } else {
      window.addEventListener('load', () => setTimeout(hideLoading, 100));
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
