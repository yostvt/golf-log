<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>ScoRExolution</title>
  <meta name="description" content="ゴルフスコア管理・分析アプリ" />

  <!-- PWA / Apple -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="スコレボ" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f8fafc" />

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Apple touch icon -->
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #f8fafc;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #root { min-height: 100dvh; }

    /* ローディング画面 */
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      z-index: 9999;
      gap: 16px;
    }
    #app-loading .logo {
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(90deg, #f59e0b, #ea580c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    #app-loading .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e2e8f0;
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- ローディング表示（React起動前） -->
  <div id="app-loading">
    <div class="logo">ScoRExolution</div>
    <div class="spinner"></div>
  </div>

  <!-- Reactマウント先 -->
  <div id="root"></div>

  <!-- React / ReactDOM（CDN） -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- ゴルフ場マスタ（venues.js → グローバル VENUES を定義） -->
  <script src="venues.js"></script>

  <!-- アプリ本体（JSXビルド済み） -->
  <script src="app.js"></script>

  <script>
    // app.js がマウントし終えたらローディング画面を非表示
    window.addEventListener('DOMContentLoaded', function () {
      const loading = document.getElementById('app-loading');
      if (!loading) return;
      // MutationObserver で #root に子要素が入ったら非表示
      const obs = new MutationObserver(function () {
        const root = document.getElementById('root');
        if (root && root.childElementCount > 0) {
          loading.style.transition = 'opacity 0.3s';
          loading.style.opacity = '0';
          setTimeout(function () { loading.remove(); }, 350);
          obs.disconnect();
        }
      });
      obs.observe(document.getElementById('root'), { childList: true });
    });
  </script>

</body>
</html>
